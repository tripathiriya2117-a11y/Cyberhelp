{% extends "base.html" %}

{% block title %}Admin Login - CyberHelp{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white text-center p-4">
                        <div class="shield-icon mx-auto mb-2" style="width: 44px; height: 44px; background: #0284c7; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #fff;">
                            <i class="bi bi-shield-lock"></i>
                        </div>
                        <h4 class="fw-bold mb-0 text-white">Helpdesk Admin Portal</h4>
                        <p class="small text-secondary mb-0">Secure Authenticated Management</p>
                    </div>
                    <div class="card-body p-4 p-md-5 bg-white">
                        <form method="POST" action="{{ url_for('admin_login') }}">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold text-dark">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" placeholder="admin" required autofocus>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold text-dark">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="admin123" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                            </button>
                        </form>

                        <div class="alert alert-light border small text-muted mt-4 mb-0 text-center">
                            <i class="bi bi-info-circle text-primary me-1"></i> Default seeded credentials: <code>admin</code> / <code>admin123</code>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
